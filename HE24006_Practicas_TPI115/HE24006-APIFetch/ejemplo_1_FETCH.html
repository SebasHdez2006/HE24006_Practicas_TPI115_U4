<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
<title>HOLA MUNDO CON API FETCH , en parrafo</title>
<script type="text/javascript">

function descargaArchivo() {

fetch("contenido1.txt")
.then(response => {
  if(response.status===200) 
  return response.text(); 
  else 
  return "Error 404" 
})
.then(texto => {
      window.document.getElementById('parrafo').innerHTML=texto;
});
}
//función que procesa la respuesta

 window.onload = descargaArchivo;//cuando se usa sin parentesis el nombre de una función se entiende como apuntador

</script>
<style type="text/css">
#parrafo {border-style:dotted;border-color:blue;}
}
</style>

</head>

<body>
<!-- se ha usado un id para identificar al parrafo desde javascript -->
<p id="parrafo"></p>
<!-- TOME NOTA DE QUE ESTE DOCUMENTO ES UN DOCUMENTO VACIO -->

</body>

</html>
