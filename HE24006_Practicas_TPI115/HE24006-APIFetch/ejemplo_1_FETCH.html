<script type="text/javascript">

function descargaArchivo() {

fetch("contenido1.txt")
.then(response => {
  if(response.status===200) 
  return response.text(); 
  else 
  return "Error 404" 
})
.then(texto => {
      window.document.getElementById('parrafo').innerHTML=texto;
});
}
//función que procesa la respuesta

 window.onload = descargaArchivo;//cuando se usa sin parentesis el nombre de una función se entiende como apuntador

</script>
<style type="text/css">
#parrafo {border-style:dotted;border-color:blue;}
}
</style>
