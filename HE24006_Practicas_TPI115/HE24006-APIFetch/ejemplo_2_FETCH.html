<script type="text/javascript">

function descargaArchivo() {

  fetch("contenido2.txt")
.then(response => {
  if(response.status===200) 
  return response.text(); 
  else 
  return "Error 404" 
})
.then(texto => {
      window.document.getElementById('cuerpo').innerHTML=texto;
});
}
 window.onload = descargaArchivo;//cuando se usa sin parentesis el nombre de una función se entiende como apuntador
</script>
<style type="text/css">
#cuerpo  {border-style:solid;border-color:red;}
}
</style>
